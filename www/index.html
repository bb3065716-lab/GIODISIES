<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1215">
<title>Geodesie</title>
<style>
  :root{
    --bg:#0b1215;--bg2:#0f181c;--card:#121d22;--card2:#1a2a31;--line:#2a3b43;--pc:#004f58;
    --acc:#4fd8eb;--acc2:#a6eefc;--txt:#e1e9ec;--mut:#8fa4ad;--ok:#a6eefc;--bad:#ffb4ab;--warn:#ffd27a;
    --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{margin:0;background:radial-gradient(90% 38% at 50% -4%,#10313a 0%,var(--bg) 70%) fixed;color:var(--txt);
    font-family:system-ui,Roboto,"Segoe UI",Tahoma,sans-serif;-webkit-user-select:none;user-select:none;
    padding-bottom:0}
  input,select{-webkit-user-select:text;user-select:text}
  button{font-family:inherit;cursor:pointer}

  header{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--sat)) 16px 10px;
    background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .logo{width:40px;height:40px;flex:none;border-radius:12px}
  #back{display:none;width:44px;height:44px;flex:none;border:0;border-radius:50%;background:var(--card2);color:var(--acc2);align-items:center;justify-content:center}
  #back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  html[dir=rtl] #back svg{transform:scaleX(-1)}
  .hd{flex:1;min-width:0}
  header h1{margin:0;font-size:20px;font-weight:600;color:var(--txt);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header small{display:block;color:var(--mut);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pill{border:0;background:var(--pc);color:var(--acc2);font-weight:700;font-size:13px;padding:9px 14px;border-radius:20px;letter-spacing:.5px}

  main{max-width:600px;margin:0 auto;padding-bottom:calc(104px + var(--sab))}
  .view{display:none;padding:14px 14px 6px;animation:fade .22s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tool{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 14px;
    text-align:start;color:var(--txt);display:flex;flex-direction:column;gap:8px;min-height:136px;transition:transform .12s,background .15s}
  .tool:active{transform:scale(.96);background:var(--card2)}
  .tool .ic{width:48px;height:48px;border-radius:16px;background:var(--pc);display:flex;align-items:center;justify-content:center;color:var(--acc2)}
  .tool .ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tool b{font-size:15px;line-height:1.25;font-weight:600}
  .tool span{font-size:12px;color:var(--mut);line-height:1.35}

  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px}
  .card h2{margin:0 0 12px;font-size:14px;color:var(--acc);display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.2px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
  .row{display:flex;gap:10px}.row>.f{flex:1;min-width:0}
  label{display:block;margin:0 4px 6px;color:var(--mut);font-size:13px}
  .f{margin-bottom:12px}.f:last-child{margin-bottom:0}
  .hint{font-size:12.5px;color:var(--mut);margin:2px 4px 10px;line-height:1.5}
  .note{font-size:12.5px;color:var(--warn);background:#2e2812;border:1px solid #5a4d1c;border-radius:16px;padding:10px 12px;margin-bottom:12px;line-height:1.5}

  .inp{position:relative}
  .inp input{width:100%;padding:14px 42px;font-size:20px;border-radius:16px;border:1.5px solid var(--line);
    background:var(--card2);color:var(--txt);text-align:center;direction:ltr;font-family:ui-monospace,Consolas,monospace;outline:none;transition:border-color .15s,box-shadow .15s}
  .inp input:focus{border-color:var(--acc);box-shadow:0 0 0 3px #4fd8eb33}
  .inp input::placeholder{color:#4a616b;font-size:15px}
  .inp .sg,.inp .cl{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;
    background:var(--pc);color:var(--acc2);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .inp .sg{left:6px}
  .inp .cl{right:6px;background:transparent;color:var(--mut);font-size:15px;display:none}
  .inp.has .cl{display:flex}
  .inp.nosg input{padding-left:14px}
  select{width:100%;padding:14px;font-size:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);color:var(--txt);outline:none}
  .txt{width:100%;padding:14px;font-size:17px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);color:var(--txt);outline:none}
  .txt:focus{border-color:var(--acc)}

  .btns{display:flex;gap:10px;margin-top:4px}
  .go{flex:1;min-height:56px;padding:0 20px;font-size:17px;font-weight:700;border:0;border-radius:28px;color:#00363d;background:var(--acc);transition:transform .08s,filter .15s}
  .go:active{transform:scale(.97);filter:brightness(.9)}
  .sec{min-height:56px;padding:0 20px;font-size:15px;border:0;border-radius:28px;background:var(--pc);color:var(--acc2);font-weight:600}
  .sec:active{filter:brightness(1.25)}

  .res{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0 auto;max-width:640px;max-height:84vh;overflow-y:auto;
    border-radius:28px 28px 0 0;border:0;border-top:1px solid var(--line);background:#16232a;padding:6px 18px calc(20px + var(--sab));
    visibility:hidden;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility .34s;box-shadow:0 -14px 44px #000b}
  .res.on{visibility:visible;transform:none}
  .grab{width:38px;height:5px;border-radius:3px;background:#3a4f59;margin:8px auto 14px;touch-action:none;position:relative}
  .grab::before{content:'';position:absolute;inset:-16px -60px}
  .cres{display:none}.cres.on{display:block;animation:fade .25s ease}
  .res .top,.cres .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .res .top h2{margin:0}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .mini{border:0;background:var(--pc);color:var(--acc2);padding:8px 13px;border-radius:16px;font-size:13px;font-weight:600}
  .mini:active{filter:brightness(1.3)}
  .big{display:flex;gap:8px;margin-bottom:10px}
  .big .k{flex:1;background:var(--card2);border-radius:20px;padding:12px 8px;text-align:center;direction:ltr}
  .big .k b{display:block;font-family:ui-monospace,Consolas,monospace;font-size:23px;color:var(--acc2);margin-top:3px}
  .big .k span{font-size:12px;color:var(--mut)}
  .kv{direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:15px}
  .kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 4px;border-bottom:1px solid #22343c}
  .kv div:last-child{border:0}
  .kv span{color:var(--mut)}
  .kv b{color:var(--txt);font-weight:600;text-align:right}
  .kv .hl b{color:var(--acc2)}
  .kv .warn b,.kv .warn span{color:var(--warn)}
  .err{display:none;margin-top:12px;background:#3a1b1b;border:1px solid #7a3535;color:var(--bad);border-radius:16px;padding:12px;font-size:14.5px}
  .err.on{display:block}
  .dial{display:block;margin:4px auto 6px;width:150px;height:150px}
  .plot{display:block;width:100%;height:260px;border-radius:20px;background:var(--bg);border:1px solid var(--line);margin:8px 0 12px;touch-action:none}
  #scrim{position:fixed;inset:0;background:#000a;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:29}
  #scrim.on{opacity:1;visibility:visible}

  .formula{background:var(--card);border:1px solid var(--pc);padding:14px;border-radius:20px;text-align:center;direction:ltr;color:var(--acc2);font-size:20px;margin-bottom:12px;font-family:ui-monospace,Consolas,monospace}
  .seg{display:flex;border:1px solid var(--line);border-radius:26px;padding:3px;margin-bottom:12px;gap:3px;background:var(--bg2)}
  .seg button{flex:1;border:0;background:none;color:var(--mut);padding:11px 4px;font-size:13.5px;border-radius:22px;line-height:1.25}
  .seg button.on{background:var(--pc);color:var(--acc2);font-weight:700}
  .chk{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:14.5px;color:var(--txt);margin:0}
  .chk input{width:22px;height:22px;accent-color:var(--acc)}
  .leg{align-items:flex-start;margin-bottom:8px}
  .leg .f{margin:0}
  .leg .del{align-self:center;flex:none;padding:10px 12px}
  .sub{font-size:13px;color:var(--acc);margin:4px 4px 8px;font-weight:600}
  .pickbtn{margin:0 0 10px}

  .hi{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
  .hi:last-child{border:0}
  .hi .t{font-size:12px;color:var(--mut)}
  .hi pre{margin:4px 0 0;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:14px;white-space:pre-wrap;color:var(--txt)}
  .empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
  .langbtn{display:flex;width:100%;align-items:center;justify-content:space-between;padding:16px;margin-bottom:8px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;font-weight:600}
  .langbtn.on{border-color:var(--acc);background:var(--pc);color:var(--acc2)}
  .about{text-align:center;color:var(--mut);font-size:13px;margin-top:18px;line-height:1.7}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .phead b{font-size:16px;color:var(--acc2)}
  .prow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid #22343c;font-size:14px}
  .prow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .prow code{direction:ltr;color:var(--mut);font-size:13px}
  .plist{max-height:52vh;overflow:auto}
  .pickrow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:13px;margin-bottom:8px;border-radius:18px;border:0;background:var(--card2);color:var(--txt);text-align:start}
  .pickrow span{color:var(--mut);font-size:12px;flex:1}
  .pickrow code{direction:ltr;font-size:13px;color:var(--acc2)}

  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding:8px 6px calc(10px + var(--sab));z-index:10}
  nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px;font-size:12px;transition:color .15s}
  nav button svg{width:24px;height:24px;padding:5px 18px;box-sizing:content-box;border-radius:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:background .2s}
  nav button.on{color:var(--acc2);font-weight:700}
  nav button.on svg{background:var(--pc)}

  #modal{position:fixed;inset:0;z-index:40;background:#000b;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .25s,visibility .25s}
  #modal.on{visibility:visible;opacity:1}
  .msheet{width:100%;max-width:640px;background:#16232a;border-radius:28px 28px 0 0;padding:6px 18px calc(18px + var(--sab));max-height:90vh;overflow:auto;transform:translateY(60px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  #modal.on .msheet{transform:none}
  .msheet h3{margin:0 0 14px;font-size:18px;color:var(--txt)}
  #toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));transform:translate(-50%,20px);background:#e1e9ec;color:#0b1215;
    padding:11px 20px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(70% 50% at 50% 40%,#12363d 0%,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s,visibility .45s}
  #splash.out{opacity:0;visibility:hidden}
  #splash h2{margin:0;font-size:22px;font-weight:600;color:var(--acc2);opacity:0;animation:spt .6s .9s ease forwards}
  .sp-c{stroke-dasharray:503;stroke-dashoffset:503;animation:spd 1.05s .1s ease forwards}
  .sp-k{opacity:0;animation:spt .5s .8s ease forwards}
  .sp-n{transform-origin:100px 100px;transform:rotate(-85deg);animation:sps 1.1s .6s cubic-bezier(.2,.9,.3,1.25) forwards}
  @keyframes spd{to{stroke-dashoffset:0}}
  @keyframes spt{to{opacity:1}}
  @keyframes sps{to{transform:rotate(55deg)}}

</style>
</head>
<body>

</nav>
<div id="toast"></div>

/* ================= formats & lecture ================= */
function fm(a){
  a = Math.round(a * 100) / 100;
  const neg = a < 0; if (neg) a = -a;
  const w = Math.floor(a / 100);
  const r = Math.round((a - w * 100) * 100) / 100;
  const ip = Math.floor(r), fr = r - ip;
  let t = String(ip).padStart(2, '0');
  if (fr > 1e-9) t += fr.toFixed(2).slice(1).replace(/0+$/, '');
  return (neg ? '-' : '') + w + '-' + t;
}
function pa(s){
  s = String(s).trim().replace(',', '.'); let sg = 1;
  if (s.startsWith('-')){ sg = -1; s = s.slice(1); }
  if (s === '') throw new Error(T('errVals'));
  if (s.includes('-')){
    const p = s.split('-');
    if (p.length !== 2 || p[0] === '' || p[1] === '' || isNaN(p[0]) || isNaN(p[1])) throw new Error(T('errAng'));
    return sg * (parseFloat(p[0]) * 100 + parseFloat(p[1]));
  }
  if (isNaN(s)) throw new Error(T('errVals'));
  return sg * parseFloat(s);
}
function pn(s){ s = String(s).trim().replace(',', '.'); if (s === '' || isNaN(s)) throw new Error(T('errVals')); return parseFloat(s); }
const n = id => pn($(id).value), na = id => pa($(id).value);
function fmtDMS(x, dec){
  dec = dec == null ? 2 : dec; const sg = x < 0 ? '-' : ''; x = Math.abs(x);
  let d = Math.floor(x), m = Math.floor((x - d) * 60), s = ((x - d) * 60 - m) * 60;
  s = +s.toFixed(dec); if (s >= 60){ s = 0; m++; } if (m >= 60){ m = 0; d++; }
  return sg + d + '° ' + String(m).padStart(2, '0') + "' " + s.toFixed(dec).padStart(dec ? 3 + dec : 2, '0') + '"';
}

/* ================= géodésie : projections ================= */
const WGS = {a: 6378137, f: 1 / 298.257223563};
const CLK = {a: 6378249.2, f: 1 / 293.4660213};
function utmZone(lon){ return Math.min(60, Math.max(1, Math.floor((lon + 180) / 6) + 1)); }
function utmFwd(lat, lon, zone){

  const p = lat * d2r, l0 = ((zone - 1) * 6 - 180 + 3) * d2r, l = lon * d2r;
  const N = a / Math.sqrt(1 - e2 * Math.sin(p) ** 2), T = Math.tan(p) ** 2, C = ep2 * Math.cos(p) ** 2, A = (l - l0) * Math.cos(p);

  const x = k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
  let y = k0 * (M + N * Math.tan(p) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  if (lat < 0) y += 1e7;
  return {E: x, N: y};
}
function utmInv(E, Nn, zone){
  const {a, f} = WGS, e2 = f * (2 - f), ep2 = e2 / (1 - e2), k0 = 0.9996, r2d = 180 / Math.PI;
  const x = E - 500000, M = Nn / k0, l0 = (zone - 1) * 6 - 180 + 3;
  const mu = M / (a * (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256)), e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
  const p1 = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu) + (21 * e1 ** 2 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu) + (151 * e1 ** 3 / 96) * Math.sin(6 * mu) + (1097 * e1 ** 4 / 512) * Math.sin(8 * mu);
  const C1 = ep2 * Math.cos(p1) ** 2, T1 = Math.tan(p1) ** 2, N1 = a / Math.sqrt(1 - e2 * Math.sin(p1) ** 2), R1 = a * (1 - e2) / Math.pow(1 - e2 * Math.sin(p1) ** 2, 1.5), D = x / (N1 * k0);
  const lat = p1 - (N1 * Math.tan(p1) / R1) * (D * D / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * D ** 4 / 24 + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * D ** 6 / 720);
  const lon = (D - (1 + 2 * T1 + C1) * D ** 3 / 6 + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * D ** 5 / 120) / Math.cos(p1);
  return {lat: lat * r2d, lon: l0 + lon * r2d};
}
const LAM = (() => { const {a, f} = CLK, e2 = f * (2 - f), e = Math.sqrt(e2), p0 = 36 * Math.PI / 180, k0 = 0.999625544;
  const tf = p => Math.tan(Math.PI / 4 - p / 2) / Math.pow((1 - e * Math.sin(p)) / (1 + e * Math.sin(p)), e / 2);
  const m0 = Math.cos(p0) / Math.sqrt(1 - e2 * Math.sin(p0) ** 2), n = Math.sin(p0), t0 = tf(p0), F = m0 / (n * Math.pow(t0, n));
  return {a, e, k0, n, F, tf, l0: 2.7, X0: 500000, Y0: 300000, r0: a * k0 * F * Math.pow(t0, n)}; })();
function lamFwd(lat, lon){
  const d2r = Math.PI / 180, {a, k0, n, F, tf, l0, X0, Y0, r0} = LAM;
  const rho = a * k0 * F * Math.pow(tf(lat * d2r), n), th = n * (lon - l0) * d2r;
  return {E: X0 + rho * Math.sin(th), N: Y0 + r0 - rho * Math.cos(th)};
}
function lamInv(E, Nn){
  const {a, e, k0, n, F, l0, X0, Y0, r0} = LAM, dx = E - X0, dy = r0 - (Nn - Y0);
  const rho = Math.sqrt(dx * dx + dy * dy), t = Math.pow(rho / (a * k0 * F), 1 / n), th = Math.atan2(dx, dy);
  let p = Math.PI / 2 - 2 * Math.atan(t);
  for (let i = 0; i < 12; i++) p = Math.PI / 2 - 2 * Math.atan(t * Math.pow((1 - e * Math.sin(p)) / (1 + e * Math.sin(p)), e / 2));
  return {lat: p * 180 / Math.PI, lon: th / n * 180 / Math.PI + l0};
}

 run(){

  else if (m === 'D'){ A = A0; const s = Math.sin(A * K); if (Math.abs(s) < 1e-9) throw new Error(T('div0')); L = Lv; D = L / s; C = D * Math.cos(A * K); f = 'D = ' + L + ' / sin(' + fm(A) + ')'; }
  else { L = Lv; D = D0; if (D === 0) throw new Error(T('div0')); if (Math.abs(L) > Math.abs(D)) throw new Error(T('errSin')); A = Math.asin(L / D) / K; C = D * Math.cos(A * K); f = 'α = asin(' + L + ' / ' + D + ')'; }

/* --- 4. intersection / relèvement --- */
let imode = 'F';
const ptBlock = (k, opt) => card(null, '<div class="sub" data-i="' + (opt ? 'ptC' : 'ptK') + '">' + '</div>' + (opt ? '' : '<div class="sub">' + k + '</div>')
  + row2(fld('x_' + k + 'x', 'X (m)', {raw: 1}), fld('x_' + k + 'y', 'Y (m)', {raw: 1})) +
  '<div class="f"><label class="azl" data-i="azF"></label><div class="inp nosg"><input type="text" id="x_' + k + 'a" class="ang" inputmode="numeric" data-p="phAng" placeholder="0.00"><button class="cl" type="button">✕</button></div></div>');
addTool({id: 'inter', body: () =>
  seg('seg_inter', [['F', 'mFwd'], ['R', 'mRes']]) + ptBlock('A') + ptBlock('B') + ptBlock('C', 1) + btns('inter') + resBlock('inter', {plot: 1, extra: '<button class="mini" onclick="saveLastP()">💾 P</button>'}),
 init(){ $$('#seg_inter button').forEach(b => b.onclick = () => { $$('#seg_inter button').forEach(x => x.classList.toggle('on', x === b)); imode = b.dataset.m; interLbl(); $('r_inter').classList.remove('on'); }); interLbl(); },
 run(){
  const pts = [];
  ['A', 'B', 'C'].forEach(k => {
    const vs = ['x', 'y', 'a'].map(s => $('x_' + k + s).value.trim());
    if (k === 'C' && vs.every(v => v === '')) return;
    pts.push({k, x: pn(vs[0]), y: pn(vs[1]), az: pa(vs[2])});
  });
  if (pts.length < 2) throw new Error(T('need2'));
  let a11 = 0, a12 = 0, a22 = 0, b1 = 0, b2 = 0;
  pts.forEach(p => { p.th = (p.az + (imode === 'R' ? MILS / 2 : 0)) * K; const c = Math.cos(p.th), s = Math.sin(p.th);
    a11 += c * c; a12 += -c * s; a22 += s * s; b1 += c * c * p.x - c * s * p.y; b2 += -c * s * p.x + s * s * p.y; });
  const det = a11 * a22 - a12 * a12;
  if (det < 1e-10) throw new Error(T('parallel'));
  const X = (a22 * b1 - a12 * b2) / det, Y = (a11 * b2 - a12 * b1) / det;
  let maxr = 0, behind = false; const rows = [];
  pts.forEach(p => { const c = Math.cos(p.th), s = Math.sin(p.th), r = Math.abs(c * (X - p.x) - s * (Y - p.y));
    maxr = Math.max(maxr, r); if (((X - p.x) * s + (Y - p.y) * c) < -1e-6) behind = true;
    rows.push(['D(' + p.k + '→P)', f2(Math.hypot(X - p.x, Y - p.y)) + ' m']); });
  const out = [['XP', f2(X) + ' m', 'hl'], ['YP', f2(Y) + ' m', 'hl']].concat(rows);
  if (pts.length > 2) out.push([T('resid'), f2(maxr) + ' m']);
  if (behind) out.push([T('behind'), '!', 'warn']);
  showRes('inter', [['XP', f2(X)], ['YP', f2(Y)]], out,
    T(imode === 'F' ? 'mFwd' : 'mRes') + '\n' + pts.map(p => p.k + '(' + f2(p.x) + ' ; ' + f2(p.y) + ') α=' + fm(norm(p.az))).join('  ') + '\nP(' + f2(X) + ' ; ' + f2(Y) + ')');
  setPlot('inter', {pts: pts.map(q => ({x: q.x, y: q.y, l: q.k})).concat([{x: X, y: Y, l: 'P', c: 1}]), lines: pts.map((q, i) => [i, pts.length]), dash: 1});
 }});

function renderPages(entries){

    x.fillStyle = '#fff'; x.fillRect(0, 0, W, Hh); x.fillStyle = '#0b1215'; x.fillRect(0, 0, W, 150);

    x.fillText(T('title'), rtl ? W - M : M, 75); y = 220; pages.push(c); };
  const wrap = (s, maxW) => { const out = []; s.split('\n').forEach(line => { let cur = ''; line.split(' ').forEach(w => { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur){ out.push(cur); cur = w; } else cur = t; }); out.push(cur); }); return out; };

  entries.forEach(h => {

    const lines = wrap(h.text, W - 2 * M), need = 90 + lines.length * 44 + 40;

    const d = new Date(h.t); x.fillText(T(h.k) + '  •  ' + d.toLocaleDateString(loc) + ' ' + d.toLocaleTimeString(loc, {hour: '2-digit', minute: '2-digit'}), rtl ? W - M : M, y + 20);
    y += 62; x.direction = 'ltr'; x.textAlign = 'left'; x.font = '32px monospace'; x.fillStyle = '#111';

    if (ps.size === 1){ v.dx += (e.clientX - o.x) * d; v.dy += (e.clientY - o.y) * d; }
    else if (ps.size === 2){ const nd = dist(), a = [...ps.values()]; if (last > 0 && nd > 0) zoom(nd / last, (a[0].x + a[1].x) / 2, (a[0].y + a[1].y) / 2); last = nd; }
    drawPlot(c); });
  const up = e => { ps.delete(e.pointerId); last = dist(); };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  c.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); drawPlot(c); }, {passive: false});
}
function drawPlot(c){
  const s = c._s; if (!s) return;
  const d = devicePixelRatio || 1, W = Math.max(200, Math.round(c.clientWidth * d)), Hh = Math.round(260 * d);
  if (c.width !== W || c.height !== Hh){ c.width = W; c.height = Hh; }
  const g = c.getContext('2d'); g.clearRect(0, 0, W, Hh);
  const xs = s.pts.map(p => p.x), ys = s.pts.map(p => p.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const span = Math.max(x1 - x0, y1 - y0, 10), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, pad = 56 * d;
  const sc = Math.min((W - 2 * pad) / Math.max(x1 - x0, span * .2), (Hh - 2 * pad) / Math.max(y1 - y0, span * .2));
  const v = c._v, S = sc * v.k, X = x => W / 2 + v.dx + (x - cx) * S, Y = y => Hh / 2 + v.dy - (y - cy) * S;
  /* grille */
  const st = niceStep(70 * d / S), wx0 = cx + (-W / 2 - v.dx) / S, wx1 = cx + (W / 2 - v.dx) / S, wy1 = cy + (Hh / 2 + v.dy) / S, wy0 = cy + (-Hh / 2 + v.dy) / S;
  g.lineWidth = 1; g.font = (10 * d) + 'px sans-serif'; g.fillStyle = 'rgba(160,190,200,.5)'; g.textAlign = 'center'; g.strokeStyle = 'rgba(160,190,200,.12)';
  let n = 0;
  for (let gx = Math.ceil(wx0 / st) * st; gx <= wx1 && n < 60; gx += st, n++){ g.beginPath(); g.moveTo(X(gx), 0); g.lineTo(X(gx), Hh); g.stroke(); g.fillText(String(+gx.toFixed(2)), X(gx), Hh - 6 * d); }
  g.textAlign = 'left'; n = 0;
  for (let gy = Math.ceil(wy0 / st) * st; gy <= wy1 && n < 60; gy += st, n++){ g.beginPath(); g.moveTo(0, Y(gy)); g.lineTo(W, Y(gy)); g.stroke(); g.fillText(String(+gy.toFixed(2)), 6 * d, Y(gy) - 4 * d); }
  /* polygone */
  if (s.fill && s.pts.length > 2){ g.beginPath(); s.pts.forEach((p, i) => i ? g.lineTo(X(p.x), Y(p.y)) : g.moveTo(X(p.x), Y(p.y))); g.closePath(); g.fillStyle = 'rgba(79,216,235,.14)'; g.fill(); }
  /* lignes */
  g.lineWidth = 2.5 * d; g.lineJoin = 'round'; g.strokeStyle = '#4fd8eb'; g.setLineDash(s.dash ? [8 * d, 6 * d] : []);
  (s.lines || []).forEach(l => { const a = s.pts[l[0]], b = s.pts[l[1]]; g.beginPath(); g.moveTo(X(a.x), Y(a.y)); g.lineTo(X(b.x), Y(b.y)); g.stroke(); });
  g.setLineDash([]);
  /* points */
  g.font = 'bold ' + (13 * d) + 'px sans-serif'; g.textAlign = 'left';
  s.pts.forEach(p => { g.beginPath(); g.arc(X(p.x), Y(p.y), 7 * d, 0, 7); g.fillStyle = p.c ? '#ffd27a' : '#a6eefc'; g.fill(); g.lineWidth = 2 * d; g.strokeStyle = '#0b1215'; g.stroke();
    g.fillStyle = '#e1e9ec'; g.fillText(p.l, X(p.x) + 11 * d, Y(p.y) - 9 * d); });
  /* nord + échelle */
  const nx = W - 26 * d, ny = 34 * d; g.beginPath(); g.moveTo(nx, ny - 16 * d); g.lineTo(nx - 8 * d, ny + 6 * d); g.lineTo(nx + 8 * d, ny + 6 * d); g.closePath(); g.fillStyle = '#4fd8eb'; g.fill();
  g.fillStyle = '#e1e9ec'; g.textAlign = 'center'; g.fillText('N', nx, ny + 22 * d);
  g.textAlign = 'left'; g.fillStyle = 'rgba(225,233,236,.6)'; g.font = (11 * d) + 'px sans-serif'; g.fillText(T('plotHint'), 10 * d, 16 * d);
  g.textAlign = 'right'; g.fillText('▦ ' + st + ' m', W - 8 * d, Hh - 20 * d);
}
window.addEventListener('resize', () => $$('canvas.plot').forEach(drawPlot));

/* ================= projets & points ================= */
let PR = []; try{ PR = JSON.parse(localStorage.getItem('geo_proj') || '[]'); }catch(e){ PR = []; }
const savePR = () => { try{ localStorage.setItem('geo_proj', JSON.stringify(PR)); }catch(e){} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
mainEl.insertAdjacentHTML('beforeend', '<section class="view" id="v_proj"><button class="go" id="proj_new" data-i="projNew" style="width:100%;margin-bottom:14px"></button><div id="proj"></div></section>');
$('v_hist').insertAdjacentHTML('beforebegin', '');
document.querySelector('nav button[data-n="hist"]').insertAdjacentHTML('beforebegin',
  '<button data-n="proj"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i="nProj"></span></button>');
document.querySelector('nav button[data-n="proj"]').onclick = () => show('proj');

function renderProj(){
  const el = $('proj');
  el.innerHTML = PR.length ? PR.map(p => '<div class="card"><div class="phead"><b>' + esc(p.name) + '</b><div class="acts">' +
    '<button class="mini" data-pa="add" data-id="' + p.id + '">' + T('ptAdd') + '</button><button class="mini" data-pa="ren" data-id="' + p.id + '">' + T('rename') + '</button><button class="mini" data-pa="del" data-id="' + p.id + '">' + T('del') + '</button></div></div>' +
    (p.pts.length ? p.pts.map((q, i) => '<div class="prow"><span>' + esc(q.n) + '</span><code>' + f2(q.x) + ' ; ' + f2(q.y) + '</code><button class="mini" data-pa="dpt" data-id="' + p.id + '" data-k="' + i + '">✕</button></div>').join('') : '<div class="empty" style="padding:10px">' + T('noPts') + '</div>') + '</div>').join('')
    : '<div class="empty">' + T('projEmpty') + '</div>';
}
const nameField = (id, k, v) => '<div class="f"><label>' + T(k) + '</label><input class="txt" id="' + id + '" value="' + esc(v || '') + '"></div>';
$('proj_new').onclick = () => openModal(T('newProj'), nameField('pm_name', 'projName', T('newProj') + ' ' + (PR.length + 1)), () => {
  PR.push({id: uid(), name: $('pm_name').value.trim() || T('newProj'), pts: []}); savePR(); renderProj(); });
$('proj').addEventListener('click', e => {
  const b = e.target.closest('[data-pa]'); if (!b) return; const p = PR.find(q => q.id === b.dataset.id); if (!p) return;
  const a = b.dataset.pa;
  if (a === 'add') openModal(T('ptAdd'), nameField('pm_name', 'ptName', 'P' + (p.pts.length + 1)) + row2(fld('pm_x', 'X (m)', {raw: 1}), fld('pm_y', 'Y (m)', {raw: 1})), () => {
    const x = n('pm_x'), y = n('pm_y'); p.pts.push({n: $('pm_name').value.trim() || 'P' + (p.pts.length + 1), x, y}); savePR(); renderProj(); });
  else if (a === 'ren') openModal(T('rename'), nameField('pm_name', 'projName', p.name), () => { p.name = $('pm_name').value.trim() || p.name; savePR(); renderProj(); });
  else if (a === 'del') openModal(T('del'), '<p style="color:var(--mut);margin:0 0 14px">' + esc(p.name) + ' — ' + T('delAsk') + '</p>', () => { PR = PR.filter(q => q !== p); savePR(); renderProj(); });
  else if (a === 'dpt'){ p.pts.splice(+b.dataset.k, 1); savePR(); renderProj(); }
});
function savePoint(x, y, def){
  const opts = PR.map(p => '<option value="' + p.id + '">' + esc(p.name) + '</option>').join('') + '<option value="__new">' + esc(T('newProj')) + '</option>';
  openModal(T('saveP'), nameField('pm_name', 'ptName', def) + '<div class="f"><select id="pm_proj">' + opts + '</select></div>', () => {
    let id = $('pm_proj').value, p;
    if (id === '__new'){ p = {id: uid(), name: T('newProj') + ' ' + (PR.length + 1), pts: []}; PR.push(p); } else p = PR.find(q => q.id === id);
    p.pts.push({n: $('pm_name').value.trim() || def, x, y}); savePR(); toast(T('saved')); });
}
function saveLastB(){ if (lastB) savePoint(lastB.x, lastB.y, 'B'); }
function saveLastP(){ if (lastP) savePoint(lastP.x, lastP.y, 'P'); }
function openPick(xid, yid){
  const all = []; PR.forEach(p => p.pts.forEach(q => all.push({p: p.name, n: q.n, x: q.x, y: q.y})));
  openModal(T('pickTitle'), '<div class="plist">' + (all.length ? all.map((q, i) => '<button class="pickrow" data-pk="' + i + '"><b>' + esc(q.n) + '</b><span>' + esc(q.p) + '</span><code>' + f2(q.x) + ' ; ' + f2(q.y) + '</code></button>').join('') : '<div class="empty">' + T('noSaved') + '</div>') + '</div>', null);
  $('mb').onclick = e => { const b = e.target.closest('[data-pk]'); if (!b) return; const q = all[+b.dataset.pk];
    $(xid).value = f2(q.x); $(yid).value = f2(q.y); syncHas($(xid)); syncHas($(yid)); closeModal(); };
}
[['d_xa', 'd_ya'], ['i_xa', 'i_ya'], ['i_xb', 'i_yb'], ['x_Ax', 'x_Ay'], ['x_Bx', 'x_By'], ['x_Cx', 'x_Cy'], ['tv_x', 'tv_y']].forEach(p => {
  $(p[0]).closest('.row').insertAdjacentHTML('beforebegin', '<button type="button" class="mini pickbtn" data-pick="' + p[0] + ',' + p[1] + '">📍 <span data-i="pick"></span></button>'); });
document.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b){ const a = b.dataset.pick.split(','); openPick(a[0], a[1]); } });

/* surcharge navigation / langue */
const _show = show; show = function(v){ closeSheets(); _show(v); if (v === 'proj') renderProj(); };
const _al = applyLang; applyLang = function(){ _al(); closeModal(); if (curView === 'proj') renderProj(); };

/* splash */
setTimeout(() => { const sp = $('splash'); if (sp){ sp.classList.add('out'); setTimeout(() => sp.remove(), 600); } }, 2100);

applyLang();
