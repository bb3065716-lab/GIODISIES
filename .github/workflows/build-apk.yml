name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icon and app name
        run: |
          cp -r resources/android-res/* android/app/src/main/res/
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">Geodesie</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">Geodesie</string>|' android/app/src/main/res/values/strings.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geodesie-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
