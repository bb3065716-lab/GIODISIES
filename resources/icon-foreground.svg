<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Foreground adaptive: contenu dans la zone sûre centrale (~66%) -->
  <g transform="translate(512 512)" fill="none" stroke="#4fd8eb" stroke-linecap="round">
    <!-- cercle gradué -->
    <circle r="250" stroke-width="22"/>
    <circle r="215" stroke-width="4" opacity=".55"/>
    <!-- graduations: 24 repères (tous les 250 mil) -->
    <g stroke-width="10">
      <path id="t" d="M0 -250 V-214"/>
      <use href="#t" transform="rotate(15)"/><use href="#t" transform="rotate(30)"/><use href="#t" transform="rotate(45)"/>
      <use href="#t" transform="rotate(60)"/><use href="#t" transform="rotate(75)"/><use href="#t" transform="rotate(90)"/>
      <use href="#t" transform="rotate(105)"/><use href="#t" transform="rotate(120)"/><use href="#t" transform="rotate(135)"/>
      <use href="#t" transform="rotate(150)"/><use href="#t" transform="rotate(165)"/><use href="#t" transform="rotate(180)"/>
      <use href="#t" transform="rotate(195)"/><use href="#t" transform="rotate(210)"/><use href="#t" transform="rotate(225)"/>
      <use href="#t" transform="rotate(240)"/><use href="#t" transform="rotate(255)"/><use href="#t" transform="rotate(270)"/>
      <use href="#t" transform="rotate(285)"/><use href="#t" transform="rotate(300)"/><use href="#t" transform="rotate(315)"/>
      <use href="#t" transform="rotate(330)"/><use href="#t" transform="rotate(345)"/>
    </g>
    <!-- axes de visée -->
    <path d="M0 -150 V150 M-150 0 H150" stroke-width="8" opacity=".5"/>
    <!-- arc d'angle (mil) -->
    <path d="M0 -120 A120 120 0 0 1 104 -60" stroke="#e1e9ec" stroke-width="14"/>
    <!-- visée AB -->
    <path d="M0 0 L158 -92" stroke="#e1e9ec" stroke-width="16"/>
    <!-- point B -->
    <circle cx="158" cy="-92" r="26" fill="#4fd8eb" stroke="none"/>
    <!-- point A (station) -->
    <circle r="30" fill="#0b1215" stroke-width="16"/>
    <circle r="9" fill="#4fd8eb" stroke="none"/>
    <!-- flèche du nord -->
    <path d="M0 -296 L-22 -262 H22 Z" fill="#4fd8eb" stroke="none"/>
  </g>
</svg>
